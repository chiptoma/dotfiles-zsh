# ~/.config/starship.toml

# 1. Insert a blank line between shell prompts (breathing room)
add_newline = false

# 2. The order of modules (Left side)
format = """
[╭─](238)$username$hostname$directory$git_branch$git_state$git_metrics$git_status$docker_context$package$python$nodejs$rust$golang
[╰─](238)$character"""

# 3. The order of modules (Right side - usually time/duration)
right_format = """$cmd_duration"""

# --- MODULE SETTINGS ---

# The prompt symbol (The arrow you type next to)
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Directory settings (Truncate long paths)
[directory]
style = "blue"
truncation_length = 3
truncate_to_repo = true
read_only = " 🔒"

[package]
symbol = "📦 "
format = "[$symbol$version]($style) "

# Git settings (The most important part)
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "🏳 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_state]
style = "bold yellow"
format = "[($state( $progress_current/$progress_total))]($style) "
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"

# Language Runtimes (Only show when relevant files exist)
[python]
symbol = "🐍 "
style = "yellow"
# Only show python version if a pyproject.toml or .py file exists
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt"]

[nodejs]
symbol = "⬢ "
format = "[$symbol($version )]($style)"

[rust]
symbol = "🦀 "
style = "red"

[golang]
symbol = "🐹 "
style = "cyan"

[docker_context]
symbol = "🐳 "
style = "blue"

# [aws]
# symbol = "☁️  "
# style = "bold orange"
# disabled = false
# Only show if AWS_PROFILE is set
# format = "on [$symbol($profile )(\($region\) )]($style)"

# [kubernetes]
# symbol = "☸ "
# style = "cyan"
# disabled = false
# format = "at [$symbol$context( \($namespace\))]($style) "

# Command Duration (Shows how long a command took if > 2s)
[cmd_duration]
min_time = 2_000
style = "yellow"
format = "took [$duration]($style)"

# ----------------------------------------------------------
# HOSTNAME & USERNAME (SSH sessions only)
# ----------------------------------------------------------

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "bold green"

[username]
show_always = false
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"
